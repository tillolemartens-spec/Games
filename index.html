<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Reflex Arcade</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #05050a;
            color: #f3f4f6;
        }
        .arcade-font {
            font-family: 'Orbitron', sans-serif;
        }
        @keyframes neonPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 15px var(--glow-color), inset 0 0 15px var(--glow-color);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 35px var(--glow-color), inset 0 0 25px var(--glow-color);
            }
        }
        .neon-target {
            animation: neonPulse 0.7s infinite alternate ease-in-out;
        }
        .glass-panel {
            background: rgba(17, 17, 27, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between selection:bg-pink-500 selection:text-white overflow-x-hidden">

    <!-- Header / Nav -->
    <header class="w-full py-4 px-6 glass-panel border-b border-white/10 flex justify-between items-center z-10 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-4 h-4 rounded-full bg-cyan-400 animate-ping"></div>
            <h1 class="arcade-font text-xl md:text-2xl font-black tracking-wider bg-gradient-to-r from-cyan-400 via-pink-500 to-purple-500 bg-clip-text text-transparent">
                NEON REFLEX
            </h1>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-right hidden sm:block">
                <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Highscore</p>
                <p id="headerHighScore" class="arcade-font text-cyan-400 text-lg font-bold">0 Pkt</p>
            </div>
            <button id="soundToggleBtn" onclick="toggleSound()" class="p-2.5 rounded-xl bg-gray-800/80 hover:bg-gray-700 text-gray-300 transition border border-white/10">
                🔊
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full">
        
        <!-- Dashboard Stats Bar -->
        <div class="w-full grid grid-cols-3 gap-3 mb-6">
            <div class="glass-panel p-3 rounded-2xl text-center shadow-md">
                <span class="block text-xs font-semibold text-gray-400 uppercase">Punkte</span>
                <span id="scoreDisplay" class="arcade-font text-2xl font-black text-cyan-400">0</span>
            </div>
            <div class="glass-panel p-3 rounded-2xl text-center shadow-md">
                <span class="block text-xs font-semibold text-gray-400 uppercase">Zeit</span>
                <span id="timerDisplay" class="arcade-font text-2xl font-black text-pink-500">30s</span>
            </div>
            <div class="glass-panel p-3 rounded-2xl text-center shadow-md">
                <span class="block text-xs font-semibold text-gray-400 uppercase">Fehler</span>
                <span id="missDisplay" class="arcade-font text-2xl font-black text-rose-500">0</span>
            </div>
        </div>

        <!-- Game Board (3x3 Grid) -->
        <div class="relative w-full aspect-square glass-panel p-4 rounded-3xl shadow-2xl flex items-center justify-center border border-white/10">
            
            <!-- Overlay Screen (Start / Game Over) -->
            <div id="overlayScreen" class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-3xl z-20 flex flex-col items-center justify-center p-6 text-center transition-all duration-300">
                <div id="overlayContent">
                    <h2 class="arcade-font text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-3">
                        READY?
                    </h2>
                    <p class="text-gray-300 text-sm mb-6 max-w-xs leading-relaxed">
                        Klicke so schnell wie möglich auf die leuchtenden Neon-Knöpfe, bevor die Zeit ablauft!
                    </p>
                </div>
                <button onclick="startGame()" class="arcade-font relative group px-8 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 via-pink-500 to-purple-600 text-white font-extrabold text-lg tracking-wider shadow-[0_0_25px_rgba(236,72,153,0.5)] hover:shadow-[0_0_40px_rgba(236,72,153,0.8)] active:scale-95 transition-all duration-200 cursor-pointer">
                    SPIEL STARTEN
                </button>
            </div>

            <!-- 3x3 Button Grid -->
            <div class="grid grid-cols-3 gap-3 w-full h-full">
                <!-- Buttons 0 to 8 -->
                <button onclick="handleTileClick(0)" class="tile bg-gray-900/90 border border-white/5 rounded-2xl transition-all duration-100 flex items-center justify-center text-2xl active:scale-95 shadow-inner cursor-pointer" data-index="0"></button>
                <button onclick="handleTileClick(1)" class="tile bg-gray-900/90 border border-white/5 rounded-2xl transition-all duration-100 flex items-center justify-center text-2xl active:scale-95 shadow-inner cursor-pointer" data-index="1"></button>
                <button onclick="handleTileClick(2)" class="tile bg-gray-900/90 border border-white/5 rounded-2xl transition-all duration-100 flex items-center justify-center text-2xl active:scale-95 shadow-inner cursor-pointer" data-index="2"></button>
                <button onclick="handleTileClick(3)" class="tile bg-gray-900/90 border border-white/5 rounded-2xl transition-all duration-100 flex items-center justify-center text-2xl active:scale-95 shadow-inner cursor-pointer" data-index="3"></button>
                <button onclick="handleTileClick(4)" class="tile bg-gray-900/90 border border-white/5 rounded-2xl transition-all duration-100 flex items-center justify-center text-2xl active:scale-95 shadow-inner cursor-pointer" data-index="4"></button>
                <button onclick="handleTileClick(5)" class="tile bg-gray-900/90 border border-white/5 rounded-2xl transition-all duration-100 flex items-center justify-center text-2xl active:scale-95 shadow-inner cursor-pointer" data-index="5"></button>
                <button onclick="handleTileClick(6)" class="tile bg-gray-900/90 border border-white/5 rounded-2xl transition-all duration-100 flex items-center justify-center text-2xl active:scale-95 shadow-inner cursor-pointer" data-index="6"></button>
                <button onclick="handleTileClick(7)" class="tile bg-gray-900/90 border border-white/5 rounded-2xl transition-all duration-100 flex items-center justify-center text-2xl active:scale-95 shadow-inner cursor-pointer" data-index="7"></button>
                <button onclick="handleTileClick(8)" class="tile bg-gray-900/90 border border-white/5 rounded-2xl transition-all duration-100 flex items-center justify-center text-2xl active:scale-95 shadow-inner cursor-pointer" data-index="8"></button>
            </div>
        </div>

        <!-- Average Reaction Time Panel -->
        <div id="statsFooter" class="w-full mt-4 glass-panel p-3 rounded-2xl flex justify-around items-center text-center opacity-70">
            <div>
                <span class="text-[10px] text-gray-400 uppercase tracking-widest block font-bold">Ø Reaktionszeit</span>
                <span id="avgReactionDisplay" class="arcade-font text-sm font-bold text-cyan-300">- ms</span>
            </div>
            <div class="h-6 w-px bg-white/10"></div>
            <div>
                <span class="text-[10px] text-gray-400 uppercase tracking-widest block font-bold">Genauigkeit</span>
                <span id="accuracyDisplay" class="arcade-font text-sm font-bold text-pink-400">- %</span>
            </div>
        </div>
    </main>

    <!-- Footer Note -->
    <footer class="py-3 text-center text-xs text-gray-500 font-medium">
        Neon Reflex Arcade &bull; Webbasiertes Reaktionsspiel
    </footer>

    <!-- JavaScript Game Logic & Web Audio API -->
    <script>
        // Game State Variables
        let score = 0;
        let misses = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let currentTarget = -1;
        let gameActive = false;
        let soundEnabled = true;
        let reactionTimes = [];
        let targetAppearTime = 0;
        let totalClicks = 0;

        // Neon theme palettes for targets
        const neonPalettes = [
            { bg: '#06b6d4', glow: '#06b6d4' }, // Cyan
            { bg: '#ec4899', glow: '#ec4899' }, // Pink
            { bg: '#8b5cf6', glow: '#8b5cf6' }, // Purple
            { bg: '#10b981', glow: '#10b981' }, // Emerald
            { bg: '#f59e0b', glow: '#f59e0b' }  // Amber
        ];

        // Web Audio API Context Setup
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'miss') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(90, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'start') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggleBtn');
            btn.innerText = soundEnabled ? '🔊' : '🔇';
        }

        // Load Highscore from localStorage
        let highScore = localStorage.getItem('neon_reflex_highscore') || 0;
        document.getElementById('headerHighScore').innerText = highScore + ' Pkt';

        function startGame() {
            initAudio();
            playSound('start');

            score = 0;
            misses = 0;
            timeLeft = 30;
            reactionTimes = [];
            totalClicks = 0;
            gameActive = true;

            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('missDisplay').innerText = misses;
            document.getElementById('timerDisplay').innerText = timeLeft + 's';
            document.getElementById('avgReactionDisplay').innerText = '- ms';
            document.getElementById('accuracyDisplay').innerText = '- %';

            // Hide overlay
            const overlay = document.getElementById('overlayScreen');
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';

            // Start Timer
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = timeLeft + 's';
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            spawnNewTarget();
        }

        function spawnNewTarget() {
            if (!gameActive) return;

            // Clear previous target style
            clearCurrentTargetStyle();

            // Pick a new random tile different from current
            let nextTarget;
            do {
                nextTarget = Math.floor(Math.random() * 9);
            } while (nextTarget === currentTarget && 9 > 1);

            currentTarget = nextTarget;
            targetAppearTime = performance.now();

            // Apply neon style to new target
            const tile = document.querySelector(`[data-index="${currentTarget}"]`);
            const palette = neonPalettes[Math.floor(Math.random() * neonPalettes.length)];
            
            tile.style.setProperty('--glow-color', palette.glow);
            tile.style.backgroundColor = palette.bg;
            tile.classList.add('neon-target');
        }

        function clearCurrentTargetStyle() {
            if (currentTarget !== -1) {
                const oldTile = document.querySelector(`[data-index="${currentTarget}"]`);
                oldTile.style.backgroundColor = '';
                oldTile.style.removeProperty('--glow-color');
                oldTile.classList.remove('neon-target');
                currentTarget = -1;
            }
        }

        function handleTileClick(index) {
            if (!gameActive) return;
            totalClicks++;

            if (index === currentTarget) {
                // Correct hit!
                playSound('hit');
                const reactionTime = Math.round(performance.now() - targetAppearTime);
                reactionTimes.push(reactionTime);

                score += 100;
                document.getElementById('scoreDisplay').innerText = score;

                // Update average reaction time live
                updateStats();
                spawnNewTarget();
            } else {
                // Wrong tile clicked (Miss)
                playSound('miss');
                misses++;
                document.getElementById('missDisplay').innerText = misses;
                updateStats();

                // Flash red on clicked wrong tile
                const wrongTile = document.querySelector(`[data-index="${index}"]`);
                wrongTile.style.backgroundColor = '#ef4444';
                setTimeout(() => {
                    if (index !== currentTarget) {
                        wrongTile.style.backgroundColor = '';
                    }
                }, 150);
            }
        }

        function updateStats() {
            // Avg Reaction Time
            if (reactionTimes.length > 0) {
                const avg = Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length);
                document.getElementById('avgReactionDisplay').innerText = avg + ' ms';
            }
            // Accuracy
            if (totalClicks > 0) {
                const hits = reactionTimes.length;
                const acc = Math.round((hits / totalClicks) * 100);
                document.getElementById('accuracyDisplay').innerText = acc + ' %';
            }
        }

        function endGame() {
            gameActive = false;
            clearInterval(gameInterval);
            clearCurrentTargetStyle();

            playSound('start');

            // Check Highscore
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_reflex_highscore', highScore);
                document.getElementById('headerHighScore').innerText = highScore + ' Pkt';
            }

            // Calculate final metrics
            let avgTime = '-';
            if (reactionTimes.length > 0) {
                avgTime = Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length) + ' ms';
            }
            let accuracy = '-';
            if (totalClicks > 0) {
                accuracy = Math.round((reactionTimes.length / totalClicks) * 100) + ' %';
            }

            // Show Game Over Overlay
            const overlay = document.getElementById('overlayScreen');
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';

            document.getElementById('overlayContent').innerHTML = `
                <h2 class="arcade-font text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-2">
                    ZEIT ABGELAUFEN!
                </h2>
                <div class="my-4 space-y-2 text-left bg-gray-900/80 p-4 rounded-2xl border border-white/10">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400 font-semibold">Erreichte Punkte:</span>
                        <span class="arcade-font text-cyan-400 font-bold">${score} Pkt</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400 font-semibold">Ø Reaktionszeit:</span>
                        <span class="arcade-font text-pink-400 font-bold">${avgTime}</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400 font-semibold">Genauigkeit:</span>
                        <span class="arcade-font text-purple-400 font-bold">${accuracy}</span>
                    </div>
                    <div class="flex justify-between text-sm pt-2 border-t border-white/10">
                        <span class="text-gray-400 font-semibold">Highscore:</span>
                        <span class="arcade-font text-yellow-400 font-bold">${highScore} Pkt</span>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
