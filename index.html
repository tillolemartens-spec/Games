<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Arcade Hub – Calliope & Meteor</title>
  <style>
    :root {
      --bg-main: #080d1a;
      --bg-panel: #10192e;
      --bg-card: #16223d;
      --border-pixel: #2c4270;
      --accent-cyan: #38bdf8;
      --accent-blue: #2563eb;
      --accent-orange: #fb923c;
      --accent-red: #f43f5e;
      --accent-green: #34d399;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: radial-gradient(circle at top, #111c36 0%, var(--bg-main) 75%);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-panel);
      border: 4px solid var(--border-pixel);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.6);
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .subtitle {
      margin: 0 0 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Menü-Ansicht für Spieleauswahl */
    .menu-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .game-select-btn {
      background: linear-gradient(180deg, #1e2f54 0%, #131e38 100%);
      color: var(--text-main);
      border: 3px solid var(--accent-cyan);
      box-shadow: 0 4px 0 #0b1324, 0 0 10px rgba(56, 189, 248, 0.25);
      padding: 16px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
    }

    .game-select-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0b1324;
      background: #2563eb;
    }

    .game-select-btn small {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: normal;
    }

    .back-menu-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 2px solid var(--border-pixel);
      padding: 8px 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 14px;
      width: 100%;
      transition: all 0.15s;
    }

    .back-menu-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--text-main);
    }

    .hidden {
      display: none !important;
    }

    /* HUD / Statusleiste */
    .hud {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .hud-box {
      background: var(--bg-card);
      border: 2px solid var(--border-pixel);
      padding: 8px 10px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .hud-box span {
      color: var(--accent-cyan);
    }

    .ammo-bar-wrap {
      width: 100%;
      height: 8px;
      background: #0a1020;
      border: 1px solid var(--border-pixel);
      margin-top: 5px;
      overflow: hidden;
    }

    .ammo-bar-fill {
      height: 100%;
      width: 100%;
      background: var(--accent-green);
      transition: width 0.15s linear, background-color 0.2s;
    }

    /* Waffenauswahl */
    .weapon-select {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .weapon-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 2px solid var(--border-pixel);
      padding: 8px 4px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.12s;
    }

    .weapon-btn small {
      display: block;
      font-size: 0.7rem;
      opacity: 0.8;
      margin-top: 2px;
    }

    .weapon-btn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent-cyan);
      color: var(--text-main);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
    }

    /* Spielfeld-Canvas */
    .canvas-frame {
      position: relative;
      display: inline-block;
      border: 4px solid var(--border-pixel);
      background: #050811;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      margin-bottom: 14px;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    /* Steuerung im Pixel-Sci-Fi-Stil */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .pixel-btn {
      background: linear-gradient(180deg, #1e2f54 0%, #131e38 100%);
      color: var(--text-main);
      border: 3px solid var(--accent-cyan);
      box-shadow: 0 4px 0 #0b1324, 0 0 10px rgba(56, 189, 248, 0.25);
      padding: 12px 8px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
    }

    .pixel-btn:active, .pixel-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0b1324, 0 0 15px rgba(56, 189, 248, 0.6);
      background: #2563eb;
    }

    .pixel-btn.fire-btn {
      border-color: var(--accent-orange);
      box-shadow: 0 4px 0 #291306, 0 0 12px rgba(251, 146, 60, 0.35);
      color: #ffedd5;
    }

    .pixel-btn.fire-btn:active, .pixel-btn.fire-btn.pressed {
      background: #ea580c;
      box-shadow: 0 1px 0 #291306, 0 0 18px rgba(251, 146, 60, 0.7);
    }

    .restart-btn {
      width: 100%;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #04101d;
      border: 3px solid #bae6fd;
      box-shadow: 0 4px 0 #07304a;
      padding: 11px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .restart-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #07304a;
    }

    .status-msg {
      min-height: 22px;
      margin-bottom: 10px;
      font-weight: bold;
      color: var(--accent-orange);
      font-size: 0.95rem;
    }

    /* Rangliste */
    .leaderboard-section {
      background: var(--bg-card);
      border: 2px solid var(--border-pixel);
      padding: 12px;
      text-align: left;
    }

    .leaderboard-section label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .leaderboard-section input {
      width: 100%;
      background: #090f1f;
      border: 2px solid var(--border-pixel);
      color: var(--text-main);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 10px;
      outline: none;
    }

    .leaderboard-section input:focus {
      border-color: var(--accent-cyan);
    }

    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .leaderboard-title {
      font-size: 0.85rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }

    .clear-lb-btn {
      background: transparent;
      border: 1px solid var(--border-pixel);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.7rem;
      padding: 2px 6px;
      cursor: pointer;
    }

    .clear-lb-btn:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .leaderboard-list {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 0.85rem;
    }

    .leaderboard-list li {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px dashed rgba(44, 66, 112, 0.6);
    }

    .leaderboard-list li:first-child {
      color: var(--accent-green);
      font-weight: bold;
    }

    .leaderboard-list li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>Pixel Arcade Hub</h1>
    <p class="subtitle" id="mainSubtitle">Wähle dein Spiel aus</p>

    <!-- HAUPTMENÜ (SPIELE-AUSWAHL) -->
    <div id="mainMenu" class="menu-screen">
      <button class="game-select-btn" id="btnLaunchGame1">
        Spiel 1: Blitz-Reaktion
        <small>Teste deine Reflexe mit Knöpfen</small>
      </button>
      <button class="game-select-btn" id="btnLaunchGame2">
        Spiel 2: Meteor-Abwehr
        <small>Shooter & Strategie im Weltall</small>
      </button>
    </div>

    <!-- SPIEL 1: BLITZ-REAKTION CONTAINER -->
    <div id="game1Container" class="hidden">
      <button class="back-menu-btn" id="btnBackToMenu1">← Zurück zur Auswahl</button>
      
      <div class="hud">
        <div class="hud-box">Letzte Zeit: <span id="reactDisplay">-</span> ms</div>
        <div class="hud-box">Beste Zeit: <span id="bestReactDisplay">-</span> ms</div>
      </div>

      <div class="canvas-frame">
        <canvas id="game1Canvas" width="360" height="220"></canvas>
      </div>

      <div class="status-msg" id="reactStatusMsg">Warte auf Start...</div>

      <div class="controls" style="grid-template-columns: 1fr 1fr;">
        <button class="pixel-btn fire-btn" id="btnReactA">A [Blau]</button>
        <button class="pixel-btn" id="btnReactB" style="border-color: #c084fc;">B [Lila]</button>
      </div>

      <button class="restart-btn" id="btnReactRestart">Runde neu starten</button>

      <!-- TOP RUN LISTE SPIEL 1 -->
      <div class="leaderboard-section">
        <label for="playerName1">Dein Name für die Rangliste</label>
        <input type="text" id="playerName1" value="" maxlength="16" placeholder="Name eingeben..." />
        <div class="leaderboard-header">
          <div class="leaderboard-title">Top 5 Schnellste Runs (ms)</div>
          <button class="clear-lb-btn" id="clearLb1">Reset</button>
        </div>
        <ul class="leaderboard-list" id="leaderboardList1"></ul>
      </div>
    </div>

    <!-- SPIEL 2: METEOR-ABWEHR CONTAINER -->
    <div id="game2Container" class="hidden">
      <button class="back-menu-btn" id="btnBackToMenu2">← Zurück zur Auswahl</button>

      <div class="hud">
        <div class="hud-box">Punkte: <span id="scoreDisplay">0</span></div>
        <div class="hud-box">
          Munition: <span id="ammoDisplay">6 / 6</span>
          <div class="ammo-bar-wrap">
            <div class="ammo-bar-fill" id="ammoBar"></div>
          </div>
        </div>
      </div>

      <div class="weapon-select">
        <button class="weapon-btn active" data-weapon="single">
          Einzel
          <small>1 Mun. | 1 DMG</small>
        </button>
        <button class="weapon-btn" data-weapon="double">
          Doppel
          <small>2 Mun. | 2x1 DMG</small>
        </button>
        <button class="weapon-btn" data-weapon="laser">
          Laser
          <small>3 Mun. | Strahl</small>
        </button>
      </div>

      <div class="canvas-frame">
        <canvas id="gameCanvas" width="360" height="360"></canvas>
      </div>

      <div class="status-msg" id="statusMsg"></div>

      <div class="controls">
        <button class="pixel-btn" id="btnLeft">← Links</button>
        <button class="pixel-btn fire-btn" id="btnFire">Feuer [␣]</button>
        <button class="pixel-btn" id="btnRight">Rechts →</button>
      </div>

      <button class="restart-btn" id="btnRestart">Nochmal spielen</button>

      <!-- TOP RUN LISTE SPIEL 2 -->
      <div class="leaderboard-section">
        <label for="playerName2">Dein Name für die Rangliste</label>
        <input type="text" id="playerName2" value="" maxlength="16" placeholder="Name eingeben..." />
        <div class="leaderboard-header">
          <div class="leaderboard-title">Top 5 Piloten (Punkte)</div>
          <button class="clear-lb-btn" id="clearLb2">Reset</button>
        </div>
        <ul class="leaderboard-list" id="leaderboardList2"></ul>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // RANGLISTEN-SYSTEM (LOCALSTORAGE)
    // ==========================================
    const STORAGE_KEY_1 = 'arcade_top_runs_reaction';
    const STORAGE_KEY_2 = 'arcade_top_runs_meteor';

    let topRuns1 = JSON.parse(localStorage.getItem(STORAGE_KEY_1)) || [];
    let topRuns2 = JSON.parse(localStorage.getItem(STORAGE_KEY_2)) || [];

    const playerNameInput1 = document.getElementById('playerName1');
    const playerNameInput2 = document.getElementById('playerName2');

    // Synchronisiert den Namen zwischen beiden Eingabefeldern
    playerNameInput1.addEventListener('input', () => {
      playerNameInput2.value = playerNameInput1.value;
    });
    playerNameInput2.addEventListener('input', () => {
      playerNameInput1.value = playerNameInput2.value;
    });

    function saveReactionRun(timeMs) {
      const name = playerNameInput1.value.trim() || 'Anonym';
      topRuns1.push({ name, score: timeMs });
      topRuns1.sort((a, b) => a.score - b.score);
      topRuns1 = topRuns1.slice(0, 5);
      localStorage.setItem(STORAGE_KEY_1, JSON.stringify(topRuns1));
      renderLeaderboard1();
    }

    function saveMeteorRun(points) {
      if (points <= 0) return;
      const name = playerNameInput2.value.trim() || 'Pilot';
      topRuns2.push({ name, score: points });
      topRuns2.sort((a, b) => b.score - a.score);
      topRuns2 = topRuns2.slice(0, 5);
      localStorage.setItem(STORAGE_KEY_2, JSON.stringify(topRuns2));
      renderLeaderboard2();
    }

    function renderLeaderboard1() {
      const list = document.getElementById('leaderboardList1');
      list.innerHTML = '';
      if (topRuns1.length === 0) {
        list.innerHTML = '<li><span style="color: var(--text-muted)">Noch keine Runs gespeichert</span></li>';
        document.getElementById('bestReactDisplay').textContent = '-';
        return;
      }
      document.getElementById('bestReactDisplay').textContent = topRuns1[0].score;
      topRuns1.forEach((entry, index) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>#${index + 1} ${escapeHtml(entry.name)}</span><span>${entry.score} ms</span>`;
        list.appendChild(li);
      });
    }

    function renderLeaderboard2() {
      const list = document.getElementById('leaderboardList2');
      list.innerHTML = '';
      if (topRuns2.length === 0) {
        list.innerHTML = '<li><span style="color: var(--text-muted)">Noch keine Runs gespeichert</span></li>';
        return;
      }
      topRuns2.forEach((entry, index) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>#${index + 1} ${escapeHtml(entry.name)}</span><span>${entry.score} Pkt</span>`;
        list.appendChild(li);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('clearLb1').addEventListener('click', () => {
      topRuns1 = [];
      localStorage.removeItem(STORAGE_KEY_1);
      renderLeaderboard1();
    });

    document.getElementById('clearLb2').addEventListener('click', () => {
      topRuns2 = [];
      localStorage.removeItem(STORAGE_KEY_2);
      renderLeaderboard2();
    });

    renderLeaderboard1();
    renderLeaderboard2();


    // ==========================================
    // MENÜWECHSEL
    // ==========================================
    const mainMenu = document.getElementById('mainMenu');
    const mainSubtitle = document.getElementById('mainSubtitle');
    const game1Container = document.getElementById('game1Container');
    const game2Container = document.getElementById('game2Container');

    document.getElementById('btnLaunchGame1').addEventListener('click', () => {
      mainMenu.classList.add('hidden');
      game1Container.classList.remove('hidden');
      mainSubtitle.textContent = 'Drücke A oder B so schnell wie möglich!';
      startReactionGame();
    });

    document.getElementById('btnLaunchGame2').addEventListener('click', () => {
      mainMenu.classList.add('hidden');
      game2Container.classList.remove('hidden');
      mainSubtitle.textContent = 'Steuerung: ← → Bewegen | Leertaste Feuern';
      initMeteorGame();
    });

    document.getElementById('btnBackToMenu1').addEventListener('click', () => {
      game1Container.classList.add('hidden');
      mainMenu.classList.remove('hidden');
      mainSubtitle.textContent = 'Wähle dein Spiel aus';
      stopReactionGame();
    });

    document.getElementById('btnBackToMenu2').addEventListener('click', () => {
      game2Container.classList.add('hidden');
      mainMenu.classList.remove('hidden');
      mainSubtitle.textContent = 'Wähle dein Spiel aus';
      stopMeteorGame();
    });


    // ==========================================
    // SPIEL 1: BLITZ-REAKTION LOGIK
    // ==========================================
    const g1Canvas = document.getElementById('game1Canvas');
    const g1Ctx = g1Canvas.getContext('2d');
    const reactDisplay = document.getElementById('reactDisplay');
    const reactStatusMsg = document.getElementById('reactStatusMsg');

    let g1State = 'wait';
    let g1StartTime = 0;
    let g1TimerId = null;
    let g1RequiredKey = 'A';

    function startReactionGame() {
      g1State = 'wait';
      reactDisplay.textContent = '-';
      renderLeaderboard1();
      runReactionRound();
    }

    function stopReactionGame() {
      clearTimeout(g1TimerId);
    }

    function runReactionRound() {
      clearTimeout(g1TimerId);
      g1State = 'wait';
      reactStatusMsg.textContent = 'Warte auf Signal...';
      reactStatusMsg.style.color = 'var(--accent-orange)';
      drawReactionScreen('BEREIT HALTEN...', '#16223d');

      const randomDelay = 1200 + Math.random() * 2500;
      g1TimerId = setTimeout(() => {
        g1State = 'active';
        g1RequiredKey = Math.random() > 0.5 ? 'A' : 'B';
        g1StartTime = performance.now();
        
        if (g1RequiredKey === 'A') {
          reactStatusMsg.textContent = 'JETZT KNOPF A (BLAU)!';
          reactStatusMsg.style.color = 'var(--accent-cyan)';
          drawReactionScreen('KNOPF A!', '#1e3a8a');
        } else {
          reactStatusMsg.textContent = 'JETZT KNOPF B (LILA)!';
          reactStatusMsg.style.color = '#c084fc';
          drawReactionScreen('KNOPF B!', '#581c87');
        }
      }, randomDelay);
    }

    function handleReactionInput(key) {
      if (game1Container.classList.contains('hidden')) return;
      if (document.activeElement === playerNameInput1) return;

      if (g1State === 'wait') {
        clearTimeout(g1TimerId);
        g1State = 'falseStart';
        reactStatusMsg.textContent = 'ZU FRÜH GEDRÜCKT! (Falschstart)';
        reactStatusMsg.style.color = 'var(--accent-red)';
        drawReactionScreen('ZU FRÜH!', '#7f1d1d');
        g1TimerId = setTimeout(runReactionRound, 1500);
      } else if (g1State === 'active') {
        if (key === g1RequiredKey) {
          const reactionTime = Math.round(performance.now() - g1StartTime);
          g1State = 'result';
          reactDisplay.textContent = reactionTime;
          
          saveReactionRun(reactionTime);

          reactStatusMsg.textContent = `Treffer! Zeit: ${reactionTime} ms`;
          reactStatusMsg.style.color = 'var(--accent-green)';
          drawReactionScreen(`${reactionTime} ms`, '#064e3b');
          g1TimerId = setTimeout(runReactionRound, 2000);
        } else {
          g1State = 'falseStart';
          reactStatusMsg.textContent = 'Falscher Knopf!';
          reactStatusMsg.style.color = 'var(--accent-red)';
          drawReactionScreen('FALSCHER KNOPF', '#7f1d1d');
          g1TimerId = setTimeout(runReactionRound, 1500);
        }
      }
    }

    function drawReactionScreen(text, bgColor) {
      g1Ctx.fillStyle = bgColor;
      g1Ctx.fillRect(0, 0, g1Canvas.width, g1Canvas.height);
      
      g1Ctx.fillStyle = '#f1f5f9';
      g1Ctx.font = 'bold 22px "Courier New", Courier, monospace';
      g1Ctx.textAlign = 'center';
      g1Ctx.textBaseline = 'middle';
      g1Ctx.fillText(text, g1Canvas.width / 2, g1Canvas.height / 2);
    }

    document.getElementById('btnReactA').addEventListener('click', () => handleReactionInput('A'));
    document.getElementById('btnReactB').addEventListener('click', () => handleReactionInput('B'));
    document.getElementById('btnReactRestart').addEventListener('click', () => {
      clearTimeout(g1TimerId);
      startReactionGame();
    });


    // ==========================================
    // SPIEL 2: METEOR-ABWEHR LOGIK
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 12;
    const CELL_SIZE = canvas.width / GRID_SIZE;

    const scoreDisplay = document.getElementById('scoreDisplay');
    const ammoDisplay = document.getElementById('ammoDisplay');
    const ammoBar = document.getElementById('ammoBar');
    const statusMsg = document.getElementById('statusMsg');
    const weaponBtns = document.querySelectorAll('.weapon-btn');

    let score = 0;
    let gameOver = false;
    let scoreSaved = false;
    let playerX = 5;
    const playerY = GRID_SIZE - 1;

    const MAX_AMMO = 6;
    let ammo = MAX_AMMO;
    let reloadTimer = 0;
    const RELOAD_INTERVAL = 1100;

    let currentWeapon = 'single';
    let bullets = [];
    let lasers = [];
    let meteors = [];
    let particles = [];
    let stars = [];

    let lastTime = 0;
    let spawnTimer = 0;
    let moveTimer = 0;
    let meteorGameRunning = false;
    let animationFrameId = null;

    function initStars() {
      stars = [];
      for (let i = 0; i < 28; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() > 0.7 ? 3 : 2,
          speed: 12 + Math.random() * 25,
          alpha: 0.3 + Math.random() * 0.7
        });
      }
    }

    weaponBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        weaponBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentWeapon = btn.getAttribute('data-weapon');
      });
    });

    function initMeteorGame() {
      score = 0;
      gameOver = false;
      scoreSaved = false;
      playerX = 5;
      ammo = MAX_AMMO;
      bullets = [];
      lasers = [];
      meteors = [];
      particles = [];
      spawnTimer = 0;
      moveTimer = 0;
      reloadTimer = 0;
      meteorGameRunning = true;
      initStars();
      renderLeaderboard2();
      updateHUD();
      statusMsg.textContent = 'Bereit zur Abwehr!';
      statusMsg.style.color = 'var(--accent-orange)';
      lastTime = performance.now();
      
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(meteorGameLoop);
    }

    function stopMeteorGame() {
      meteorGameRunning = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }

    function fireWeapon() {
      if (gameOver || !meteorGameRunning) return;

      let cost = 1;
      if (currentWeapon === 'double') cost = 2;
      if (currentWeapon === 'laser') cost = 3;

      if (ammo < cost) {
        statusMsg.textContent = 'Nicht genug Munition! Nachladen läuft...';
        return;
      }

      ammo -= cost;
      updateHUD();

      if (currentWeapon === 'single') {
        bullets.push({ x: playerX, y: playerY - 1, damage: 1 });
      } else if (currentWeapon === 'double') {
        if (playerX > 0) bullets.push({ x: playerX - 0.3, y: playerY - 1, damage: 1 });
        if (playerX < GRID_SIZE - 1) bullets.push({ x: playerX + 0.3, y: playerY - 1, damage: 1 });
      } else if (currentWeapon === 'laser') {
        lasers.push({ x: playerX, duration: 180 });
        for (let i = meteors.length - 1; i >= 0; i--) {
          if (Math.abs(meteors[i].x - playerX) < 0.8) {
            createExplosion(meteors[i].x, meteors[i].y, '#38bdf8');
            score += meteors[i].hp * 10;
            meteors.splice(i, 1);
          }
        }
      }
    }

    function spawnMeteor() {
      const x = Math.floor(Math.random() * GRID_SIZE);
      const typeRand = Math.random();
      let hp = 1;
      let size = 1;
      if (typeRand > 0.75) { hp = 2; size = 1.2; }
      meteors.push({ x: x, y: 0, hp: hp, maxHp: hp, size: size });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: x * CELL_SIZE + CELL_SIZE / 2,
          y: y * CELL_SIZE + CELL_SIZE / 2,
          vx: (Math.random() - 0.5) * 80,
          vy: (Math.random() - 0.5) * 80,
          color: color,
          life: 0.4
        });
      }
    }

    function updateHUD() {
      scoreDisplay.textContent = score;
      ammoDisplay.textContent = `${ammo} / ${MAX_AMMO}`;
      ammoBar.style.width = `${(ammo / MAX_AMMO) * 100}%`;
    }

    function meteorGameLoop(timestamp) {
      if (!meteorGameRunning) return;

      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      if (!gameOver) {
        if (ammo < MAX_AMMO) {
          reloadTimer += dt * 1000;
          if (reloadTimer >= RELOAD_INTERVAL) {
            ammo++;
            reloadTimer = 0;
            updateHUD();
          }
        }

        spawnTimer += dt * 1000;
        if (spawnTimer > 1300) {
          spawnMeteor();
          spawnTimer = 0;
        }

        moveTimer += dt * 1000;
        if (moveTimer > 450) {
          moveTimer = 0;
          for (let m of meteors) {
            m.y += 1;
            if (m.y >= playerY) {
              gameOver = true;
              statusMsg.textContent = 'GAME OVER – Basis zerstört!';
              statusMsg.style.color = 'var(--accent-red)';
              if (!scoreSaved) {
                scoreSaved = true;
                saveMeteorRun(score);
              }
              break;
            }
          }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          bullets[i].y -= dt * 12;
          if (bullets[i].y < 0) {
            bullets.splice(i, 1);
            continue;
          }
          for (let j = meteors.length - 1; j >= 0; j--) {
            let m = meteors[j];
            if (Math.abs(bullets[i].x - m.x) < 0.6 && Math.abs(bullets[i].y - m.y) < 0.6) {
              m.hp -= bullets[i].damage;
              createExplosion(m.x, m.y, '#fb923c');
              bullets.splice(i, 1);
              if (m.hp <= 0) {
                score += m.maxHp * 15;
                meteors.splice(j, 1);
              }
              break;
            }
          }
        }

        for (let i = lasers.length - 1; i >= 0; i--) {
          lasers[i].duration -= dt * 1000;
          if (lasers[i].duration <= 0) lasers.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      updateHUD();
      drawMeteorGame(dt);
      animationFrameId = requestAnimationFrame(meteorGameLoop);
    }

    function drawMeteorGame(dt) {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let s of stars) {
        s.y += s.speed * dt;
        if (s.y > canvas.height) s.y = 0;
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }

      ctx.strokeStyle = 'rgba(44, 66, 112, 0.15)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
      }

      for (let l of lasers) {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
        ctx.fillRect(l.x * CELL_SIZE, 0, CELL_SIZE, canvas.height);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(l.x * CELL_SIZE + CELL_SIZE / 3, 0, CELL_SIZE / 3, canvas.height);
      }

      ctx.fillStyle = '#38bdf8';
      let px = playerX * CELL_SIZE;
      let py = playerY * CELL_SIZE;
      ctx.fillRect(px + 4, py + 8, CELL_SIZE - 8, CELL_SIZE - 8);
      ctx.fillRect(px + CELL_SIZE / 2 - 3, py + 2, 6, 8);

      ctx.fillStyle = '#34d399';
      for (let b of bullets) {
        ctx.fillRect(b.x * CELL_SIZE + CELL_SIZE / 2 - 2, b.y * CELL_SIZE, 4, 10);
      }

      for (let m of meteors) {
        ctx.fillStyle = m.maxHp > 1 ? '#f43f5e' : '#fb923c';
        let mx = m.x * CELL_SIZE;
        let my = m.y * CELL_SIZE;
        ctx.fillRect(mx + 4, my + 4, CELL_SIZE - 8, CELL_SIZE - 8);
        if (m.maxHp > 1) {
          ctx.fillStyle = '#fff';
          ctx.font = '10px monospace';
          ctx.fillText(m.hp, mx + CELL_SIZE / 2 - 3, my + CELL_SIZE / 2 + 4);
        }
      }

      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      }
    }

    document.getElementById('btnLeft').addEventListener('click', () => {
      if (playerX > 0 && !gameOver) playerX--;
    });
    document.getElementById('btnRight').addEventListener('click', () => {
      if (playerX < GRID_SIZE - 1 && !gameOver) playerX++;
    });
    document.getElementById('btnFire').addEventListener('click', fireWeapon);
    document.getElementById('btnRestart').addEventListener('click', initMeteorGame);

    window.addEventListener('keydown', (e) => {
      if (!game1Container.classList.contains('hidden')) {
        if (document.activeElement === playerNameInput1) return;
        if (e.code === 'KeyA') handleReactionInput('A');
        if (e.code === 'KeyB') handleReactionInput('B');
      }
      if (!game2Container.classList.contains('hidden')) {
        if (document.activeElement === playerNameInput2) return;
        if (e.key === 'ArrowLeft' && playerX > 0 && !gameOver) playerX--;
        if (e.key === 'ArrowRight' && playerX < GRID_SIZE - 1 && !gameOver) playerX++;
        if (e.code === 'Space') {
          e.preventDefault();
          fireWeapon();
        }
      }
    });
  </script>
</body>
</html>
